experiment: btc_perp_sma_costed

data:
  manifest: data/market/manifest.json
  market: perpetual
  timeframe: 1d
  universe: [BTC]
  start: 2020-01-01
  end: 2026-07-31

strategy:
  import: research_strategies.baselines:SmaCrossStrategy
  params:
    fast_window: 30
    slow_window: 120
    long_short: true
    gross_exposure: 1.0

execution:
  model: bar
  price_field: open
  signal_delay_bars: 1
  rebalance_policy: target_change
  initial_cash: 100000
  funding: true
  annual_borrow_bps: 0
  transaction_costs:
    - type: proportional
      name: taker_fee
      bps: 5
    - type: proportional
      name: slippage
      bps: 2
  constraints:
    max_gross_exposure: 1.0
    max_net_exposure: 1.0
    max_abs_weight: 1.0

evaluation:
  profile: research
  benchmark: BTC
  bootstrap_samples: 0

artifacts_dir: backtest-artifacts
