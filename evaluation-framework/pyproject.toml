[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-eval-stack"
version = "0.1.0"
description = "Reusable trading-strategy evaluation stack: layered metrics, DSR, PBO/CSCV, purged splits, cost models, and backtest-to-live reconciliation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
freqtrade = ["pyarrow>=14"]
factor = ["statsmodels>=0.14"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
ignore_missing_imports = true
