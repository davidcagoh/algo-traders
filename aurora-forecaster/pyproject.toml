[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-forecaster"
version = "0.1.0"
description = "Multimodal time-series forecasting experiment using DecisionIntelligence/Aurora, evaluated against evaluation-framework."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers[torch]>=4.44,<5",
    "aurora-model==0.2.0",
    "pandas>=2.0",
    "ccxt>=4",
    "yfinance>=0.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["aurora_forecaster", "aurora_forecaster.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
